spring.application.name=subasta-vehiculos-backend
server.port=${PORT:8080}

# --- Base de datos (todo por variables de entorno) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# BD compartida: pool pequeño
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# --- JSON ---
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- App ---
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-render-minimo-32-caracteres!!}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,https://axelherrera11.github.io}
app.seed.users=${SEED_USERS:true}
app.cierre.intervalo-ms=5000

server.error.include-message=always
