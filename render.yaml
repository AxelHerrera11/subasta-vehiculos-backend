services:
  - type: web
    name: subasta-vehiculos-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/salud
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://axelherrera11.github.io,http://localhost:5173
      - key: SEED_USERS
        value: "true"
